<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada — PRUMO</title>
<style>
  :root{
    --bg-page:#ddd5c6;
    --bg-app:#141210;
    --bg-card:#221e1a;
    --border-subtle:#332e27;
    --accent-gold:#c9a876;
    --text-primary:#f2ede4;
    --text-muted:#8c8275;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 0%, #e7e0d2 0%, var(--bg-page) 60%);
    color:var(--text-primary);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--bg-app);
    border:1px solid var(--border-subtle);
    border-radius:28px;
    box-shadow:0 30px 70px rgba(33,24,14,.28);
    padding:48px 36px;
    text-align:center;
  }
  .logo{
    font-family:Georgia,'Times New Roman',serif;
    letter-spacing:3px; font-size:14px; color:var(--accent-gold);
    text-transform:uppercase; margin-bottom:32px;
  }
  .code{
    font-family:Georgia,'Times New Roman',serif;
    font-size:64px; font-weight:400; color:var(--accent-gold);
    line-height:1; margin:0 0 12px;
  }
  h1{margin:0 0 10px; font-size:19px; font-weight:600}
  p{margin:0 0 28px; color:var(--text-muted); font-size:13px; line-height:1.6}
  a.btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accent-gold); color:#241f19; text-decoration:none;
    padding:12px 24px; border-radius:12px; font-size:13px; font-weight:600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">PRUMO</div>
  <p class="code">404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço que você tentou acessar não existe ou foi movido.</p>
  <a class="btn" href="/">Voltar para o início</a>
</div>
</body>
</html>
